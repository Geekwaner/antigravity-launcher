name: 功能建议
description: 提出新功能或改进建议
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        请先说明要解决的问题，再描述期望的方案。若与现有设计取舍冲突（见 README
        「判定规则」「安全边界」），也请一并说明理由。

  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 当前哪里不方便、容易误判或缺少能力
      placeholder: "例如：代理节点带认证时，希望界面能直接保存凭证而不是每次重新输入"
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 期望的方案
      placeholder: 描述你希望看到的行为或界面变化
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案（可选）
    validations:
      required: false

  - type: dropdown
    id: scope
    attributes:
      label: 影响范围
      options:
        - 界面（GUI）
        - 命令行（CLI）
        - 代理探测 / 判定逻辑
        - 打包与发布
        - 文档
    validations:
      required: true
