name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-version:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify tag matches __version__
        run: python scripts/build.py --check-tag "${{ github.ref_name }}"

  test:
    needs: check-version
    if: always() && (needs.check-version.result == 'success' || needs.check-version.result == 'skipped')
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-15, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run unit tests
        run: python -m unittest discover -s tests -v

  build-windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PyInstaller
        run: python -m pip install --upgrade pip pyinstaller
      - name: Build Windows standalone (.exe)
        run: python scripts/build.py
      - name: Verify Windows artifact
        run: |
          $exe = Get-ChildItem dist\*-win-x64-standalone.exe | Select-Object -First 1
          if (-not $exe -or $exe.Length -lt 1MB) { throw "Unexpected standalone exe output" }
          Write-Host "Built $($exe.Name) ($([math]::Round($exe.Length / 1MB, 2)) MB)"
      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-win-x64
          path: dist/*.exe

  build-macos:
    needs: test
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify tkinter and install PyInstaller
        run: |
          python -c "import tkinter; print('Tk', tkinter.TkVersion)"
          python -m pip install --upgrade pip pyinstaller
      - name: Build macOS Apple Silicon (.dmg)
        run: python scripts/build.py
      - name: Smoke test macOS bundle and DMG
        run: |
          codesign --verify --deep --strict build/macos_dist/AntigravityLauncher.app
          build/macos_dist/AntigravityLauncher.app/Contents/MacOS/aglaunch --help
          build/macos_dist/AntigravityLauncher.app/Contents/MacOS/aglaunch --version
          ls -lh dist/*.dmg
      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-mac-arm64
          path: dist/*.dmg

  publish:
    needs: [build-windows, build-macos]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-dist
          pattern: dist-*
          merge-multiple: true
      - name: Generate unified SHA256SUMS.txt
        working-directory: release-dist
        run: |
          sha256sum $(ls -1 | sort) > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body: |
            ## 下载说明 / Downloads

            | 平台 | 文件 | 说明 |
            |---|---|---|
            | **Windows x64** | `*-win-x64-standalone.exe` | 单文件便携版，免解压直接双击运行 |
            | **macOS Apple Silicon (M 系列)** | `*-mac-arm64.dmg` | 原生 `.app` 拖拽安装包（内置 `Contents/MacOS/aglaunch` CLI） |

            > macOS Intel 与 Linux 用户可直接克隆仓库运行源码（需 Python 3.10+）：`python3 aglaunch.py`。

            ### 校验与放行提示
            - 可使用附件 `SHA256SUMS.txt` 核对文件 SHA-256 校验值。
            - **Windows**：未购买商业签名证书，若 SmartScreen 提示「已保护你的电脑」，点击 **更多信息 → 仍要运行**。
            - **macOS**：未公证（ad-hoc 签名），拖入 `/Applications` 后首次打开若提示「已损坏」或「无法验证开发者」，在终端执行一次：
              ```bash
              xattr -cr /Applications/AntigravityLauncher.app
              ```
          files: |
            release-dist/*
