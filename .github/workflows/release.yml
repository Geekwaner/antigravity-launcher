name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  check-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify tag matches __version__
        run: python scripts/build.py --check-tag "${{ github.ref_name }}"

  test:
    needs: check-version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run unit tests
        run: python -m unittest discover -s tests -v

  build-windows:
    needs: [check-version, test]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PyInstaller
        run: python -m pip install --upgrade pip pyinstaller
      - name: Build portable (.zip) and standalone (.exe)
        run: python scripts/build.py --mode all
      - name: Smoke test CLI binary
        run: |
          Expand-Archive -Path dist\*-win-x64-portable.zip -DestinationPath build\smoke
          build\smoke\AntigravityLauncher\aglaunch.exe --help
          build\smoke\AntigravityLauncher\aglaunch.exe --version
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-dist
          path: |
            dist/*.zip
            dist/*.exe
            dist/SHA256SUMS.txt

  publish:
    needs: build-windows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: windows-dist
          path: dist
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body: |
            ## 下载说明 / Downloads

            本 Release 仅提供 **Windows x64** 预编译产物；macOS / Linux 请克隆仓库后从源码运行（依赖 Python 3.10+）：`python aglaunch.py`。

            - **`*-win-x64-portable.zip`（推荐）**：目录绿色版，启动更快、误报更少。**请先完整解压到文件夹**，再双击运行 `AntigravityLauncher.exe`（同目录附带命令行工具 `aglaunch.exe`）。
            - **`*-win-x64-standalone.exe`**：单文件便携版，免解压直接双击运行（首次启动会先自解压约 1~2 秒）。

            > 本项目产物未购买商业代码签名证书。若 Windows SmartScreen 弹出「已保护你的电脑」，可点击「更多信息 → 仍要运行」；不放心也可在 Releases 核对 `SHA256SUMS.txt`，或直接拉取源码用 `AntigravityLauncher.bat` 运行。
          files: |
            dist/*.zip
            dist/*.exe
            dist/SHA256SUMS.txt
